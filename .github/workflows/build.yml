name: Build Alethra AI APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLAMA_CPP_REF: b6000
      WHISPER_CPP_REF: v1.7.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK & CMake (SDK bawaan runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch llama.cpp & whisper.cpp
        run: bash scripts/fetch-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Alethra-AI-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alethra-AI-debug
          path: Alethra-AI-debug.apk
          if-no-files-found: error

      # Push ke main -> Release "latest" (selalu diperbarui dengan APK terbaru)
      - name: Publish rolling release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Alethra-AI-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Alethra AI - build terbaru" \
            --notes "APK debug otomatis dari commit $GITHUB_SHA"

      # Push tag v* (mis. v1.0.0) -> Release versi resmi
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Alethra-AI-debug.apk \
            --title "Alethra AI $GITHUB_REF_NAME" --generate-notes
